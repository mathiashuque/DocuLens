name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Detect frontend
        id: frontend
        run: |
          if [[ -f package.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            if [[ -f pnpm-lock.yaml ]]; then
              echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            elif [[ -f yarn.lock ]]; then
              echo "manager=yarn" >> "$GITHUB_OUTPUT"
            else
              echo "manager=npm" >> "$GITHUB_OUTPUT"
            fi
            node - <<'NODE' >> "$GITHUB_OUTPUT"
          const scripts = require("./package.json").scripts ?? {};
          console.log(`typecheck=${scripts["type-check"] ? "type-check" : scripts.typecheck ? "typecheck" : ""}`);
          console.log(`has_test=${scripts.test ? "true" : "false"}`);
          NODE
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Frontend is not initialized yet; skipping frontend checks."
          fi

      - name: Enable Corepack
        if: steps.frontend.outputs.available == 'true'
        run: corepack enable

      - name: Restore frontend dependency cache
        if: steps.frontend.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/yarn
            ~/.local/share/pnpm/store
          key: frontend-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json', 'apps/web/pnpm-lock.yaml', 'apps/web/yarn.lock') }}
          restore-keys: |
            frontend-${{ runner.os }}-

      - name: Install dependencies
        if: steps.frontend.outputs.available == 'true'
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            yarn install --immutable
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        if: steps.frontend.outputs.available == 'true'
        run: ${{ steps.frontend.outputs.manager }} run lint

      - name: Type-check
        if: steps.frontend.outputs.available == 'true' && steps.frontend.outputs.typecheck != ''
        run: ${{ steps.frontend.outputs.manager }} run ${{ steps.frontend.outputs.typecheck }}

      - name: Test
        if: steps.frontend.outputs.has_test == 'true'
        run: ${{ steps.frontend.outputs.manager }} run test
        env:
          CI: true

      - name: Build
        if: steps.frontend.outputs.available == 'true'
        run: ${{ steps.frontend.outputs.manager }} run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: doculens_test
          POSTGRES_USER: doculens_test
          POSTGRES_PASSWORD: doculens_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doculens_test -d doculens_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://doculens_test:doculens_test_only@localhost:5432/doculens_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e apps/api ruff mypy pytest

      - name: Lint
        run: ruff check apps/api/app agent ingestion retrieval tests

      - name: Check formatting
        run: ruff format --check apps/api/app agent ingestion retrieval tests

      - name: Type-check
        run: mypy apps/api/app agent ingestion retrieval

      - name: Test
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            pytest
          else
            echo "No backend tests exist yet; skipping pytest."
          fi
        env:
          DOCULENS_LLM_MODE: mock
