services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_DOCUMENT_PAGES: ${MAX_DOCUMENT_PAGES:-40}
      # `db` is the in-network service name; the API never connects via
      # localhost. DATABASE_URL is the canonical setting the app reads.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-doculens}:${POSTGRES_PASSWORD:-doculens_local_only}@db:5432/${POSTGRES_DB:-doculens}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doculens}
      POSTGRES_USER: ${POSTGRES_USER:-doculens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doculens_local_only}
    volumes:
      - doculens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doculens} -d ${POSTGRES_DB:-doculens}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    # Not published to the host by default; local tooling that needs a direct
    # connection can set POSTGRES_HOST_PORT and add a "ports" mapping.

volumes:
  doculens_pgdata:
